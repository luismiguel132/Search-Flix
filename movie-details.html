<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />

</head>

<body class="details-page min-h-screen bg-slate-950 text-white">
    <site-header back></site-header>

    <section class="details-hero relative isolate overflow-hidden">
        <div class="absolute inset-0">
            <img id="movie-image" alt="" src=""
                class="details-backdrop absolute inset-0 h-full w-full object-cover object-center" />
            <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/85 to-slate-950/20"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/20 to-slate-950/40"></div>
        </div>

        <div
            class="relative z-10 mx-auto flex min-h-[650px] max-w-6xl items-end px-4 pb-12 pt-28 md:min-h-[700px] md:items-center md:pb-10">
            <div class="grid w-full items-center gap-8 lg:grid-cols-[220px_minmax(0,1fr)] lg:gap-12">
                <div
                    class="details-poster-shell mx-auto hidden w-52 shrink-0 overflow-hidden rounded-2xl border border-white/20 bg-slate-900/80 shadow-2xl lg:block">
                    <img id="movie-poster" alt="" src="" class="aspect-[2/3] w-full object-cover" />
                </div>
                <div class="max-w-3xl">
                    <h1 id="movie-title"
                        class="details-title max-w-3xl font-['Bebas_Neue'] text-5xl leading-none tracking-wide text-white drop-shadow-2xl md:text-7xl">
                    </h1>
                    <div class="details-meta-row mt-5 flex flex-wrap items-center gap-2 text-sm text-slate-200">
                        <span class="details-meta-pill details-meta-pill--date">
                            <i class="fa-regular fa-calendar text-slate-400"></i>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Data</span>
                            <span id="movie-release-date"></span>
                        </span>
                        <span class="details-meta-pill details-meta-pill--score">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">TMDB</span>
                            <span id="movie-rating" class="font-bold text-yellow-300"></span>
                        </span>
                        <span id="community-rating"
                            class="details-meta-pill details-meta-pill--community whitespace-nowrap text-xs"
                            aria-live="polite">
                            <span class="text-yellow-400">★</span> Usuários: —
                        </span>
                        <div id="user-rating-panel"
                            class="details-meta-pill details-meta-pill--user flex-wrap">
                            <i class="fa-solid fa-star text-[10px] text-yellow-400"></i>
                            <span class="text-[11px] font-semibold text-slate-200">Sua nota</span>
                            <select id="user-rating-value" aria-label="Sua nota"
                                class="w-12 rounded border border-slate-600 bg-slate-800 px-1 py-1 text-[11px] text-white outline-none focus:border-yellow-400">
                                <option value="">—</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                            <button id="user-rating-save" type="button"
                                class="rounded bg-yellow-400 px-2 py-1 text-[10px] font-bold text-slate-950 transition hover:bg-yellow-300">Salvar</button>
                            <button id="user-rating-remove" type="button" aria-label="Remover minha nota"
                                class="hidden text-[10px] text-slate-400 hover:text-white"><i
                                    class="fa-solid fa-xmark"></i></button>
                            <span id="user-rating-status" class="sr-only">Dê uma nota de 1 a 10</span>
                        </div>
                    </div>

                    <div class="mt-6 grid items-start gap-5 md:grid-cols-[minmax(0,1fr)_auto]">
                        <div>
                            <p class="mb-2 text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Gêneros</p>
                            <div id="movie-geners" class="flex flex-wrap gap-2"></div>
                        </div>
                        <section id="watch-providers-section" class="hidden min-w-[190px] pt-1">
                            <div class="mb-2 flex items-center gap-2">
                                <p class="text-xs font-bold uppercase tracking-[0.2em] text-slate-400">Onde assistir</p>
                                <p id="watch-providers-region" class="text-[11px] text-slate-500">Brasil</p>
                            </div>
                            <div id="watch-providers-loading" class="text-xs text-slate-400"><i
                                    class="fa-solid fa-spinner fa-spin mr-2 text-yellow-400"></i>Buscando...</div>
                            <div id="watch-providers-list" class="hidden"></div>
                            <p id="watch-providers-empty" class="hidden text-xs text-slate-500">Nenhuma plataforma
                                encontrada.</p>
                        </section>
                    </div>
                    <p id="movie-overview" class="mt-6 max-w-2xl text-sm leading-7 text-slate-200 md:text-base"></p>
                </div>
            </div>
        </div>
    </section>

    <main class="details-content mx-auto flex w-full max-w-6xl flex-col px-4 pb-16">
        <section class="details-section mt-10" id="trailer-section">
            <div class="details-section-heading mb-4">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-yellow-400">Vídeo</p>
                <h2 class="mt-1 text-2xl font-bold text-white">Trailer</h2>
            </div>
            <div id="movie-trailer"
                class="details-media-card mx-auto w-full max-w-5xl overflow-hidden rounded-2xl border border-slate-700 bg-slate-900">
            </div>
        </section>

        <section class="details-section mt-12 hidden" id="SerieDiv">
            <div class="details-section-heading mb-4">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-yellow-400">Conteúdo da série</p>
                <h2 class="mt-1 text-2xl font-bold text-white">Temporadas e episódios</h2>
            </div>
            <div class="mb-4">
                <button id="dropdownOptionsButton" data-dropdown-toggle="dropdownOptionsMenu"
                    class="inline-flex w-full md:w-auto justify-center items-center gap-x-1.5 rounded-md bg-white/10 px-3 py-2 text-sm font-semibold text-white ring-1 ring-inset ring-white/5 hover:bg-white/20 transition-colors"
                    type="button">
                    <span id="dropdownName">Temporadas</span>
                    <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" class="-mr-1 h-5 w-5 text-gray-400">
                        <path
                            d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z"
                            clip-rule="evenodd" fill-rule="evenodd" />
                    </svg>
                </button>

                <div id="dropdownOptionsMenu"
                    class="max-h-[250px] overflow-y-scroll z-50 hidden w-56 divide-y divide-white/10 rounded-md bg-gray-800 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none">
                    <ul class="py-1 text-sm text-gray-300" aria-labelledby="dropdownOptionsButton" id="ListaTemporadas">

                    </ul>
                </div>
            </div>

            <div class="relative overflow-hidden" id="SerieCarousel">
                <div class="relative h-full overflow-hidden rounded-2xl border border-slate-700 bg-slate-900 p-4">
                    <div id="temporadas"
                        class="flex flex-nowrap gap-6 transition-transform duration-500 ease-in-out items-stretch">
                    </div>
                </div>
                <button type="button"
                    class="absolute top-0 start-0 z-10 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    id="ep-prev">
                    <span
                        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">
                        <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 6 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 1 1 5l4 4" />
                        </svg>
                    </span>
                </button>
                <button type="button"
                    class="absolute top-0 end-0 z-10 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
                    id="ep-next">
                    <span
                        class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50">
                        <svg class="w-4 h-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 6 10">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="m1 9 4-4-4-4" />
                        </svg>
                    </span>
                </button>
            </div>
        </section>
        <section class="details-section order-4 mt-12" id="comments-section">
            <div class="details-section-heading mb-4">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-yellow-400">Comunidade</p>
                <h2 class="mt-1 text-2xl font-bold text-white">Comentários</h2>
            </div>
            <div class="details-card rounded-2xl border border-slate-700 bg-slate-900 p-5 md:p-6">
                <movie-comments></movie-comments>
            </div>
        </section>

        <section class="details-section order-3 mt-12">
            <div class="details-section-heading mb-4">
                <p class="text-xs font-bold uppercase tracking-[0.2em] text-yellow-400">Você também pode gostar</p>
            </div>
            <movie-carousel></movie-carousel>
        </section>
    </main>

    <a href="/filmesFavoritos.html" aria-label="Abrir favoritos">

        <div
            class="fixed bottom-5 right-4 z-[9999] flex h-14 w-14 cursor-pointer items-center justify-center rounded-full border border-slate-600 bg-slate-800 text-yellow-400 shadow-xl transition hover:border-yellow-400 hover:bg-slate-700 md:right-8">
            <span id="contador-favoritos"
                class="absolute -right-2 -top-2 flex h-6 w-6 items-center justify-center rounded-full text-center text-xs"></span>
            <i class="fa-regular fa-bookmark text-xl"></i>
        </div>
    </a>

    <script type="module" src="details.js"></script>
    <script src="https://kit.fontawesome.com/27e8f7a4fe.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="components/site-header.js"></script>
    <script type="module" src="components/comentarios.js"></script>
    <script type="module" src="components/carousel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
