<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Flix - Favoritos</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        .favorites-search-bar #search-movies {
            color: #000 !important;
        }

        .favorites-search-bar #search-movies::placeholder {
            color: #000 !important;
            opacity: 1;
        }
    </style>
</head>
<!--Teste-->

<body id="body" class="min-h-screen bg-slate-900 text-slate-100 font-['Inter',sans-serif]">
    <header
        class="fixed top-0 z-50 flex w-full items-center justify-between border-b border-slate-700/60 bg-slate-800/95 p-4 text-white backdrop-blur-md">
        <a href="/" class="hidden text-2xl font-bold tracking-tight text-white md:block"
            style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em">Search Flix</a>
        <barra-de-pesquisa class="favorites-search-bar"></barra-de-pesquisa>
        <div class="flex items-center gap-3 md:gap-4">
            <language-dropdown class="z-50"></language-dropdown>
            <user-menu></user-menu>
        </div>
    </header>

    <main class="mx-auto w-full max-w-6xl px-4 pb-16 pt-28">
        <div class="mb-7">
            <a href="/"
                class="mb-3 inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-yellow-400">
                <i class="fa-solid fa-arrow-left"></i>Voltar para início
            </a>
            <h1 class="text-3xl font-bold text-white">Meus favoritos</h1>
            <p class="mt-1 text-sm text-slate-400">Filmes e séries que você salvou para assistir depois.</p>
        </div>
        <section class="mb-7 rounded-xl border border-slate-700 bg-slate-800/60 p-4">
            <div class="grid gap-3 md:grid-cols-[minmax(0,1fr)_180px_190px]">
                <label class="relative block">
                    <span class="sr-only">Pesquisar nos favoritos</span>
                    <i
                        class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input id="favoritos-search" type="search" placeholder="Pesquisar favoritos..."
                        class="w-full rounded-lg border border-slate-600 bg-slate-900 py-2.5 pl-10 pr-3 text-sm text-black placeholder-slate-500 outline-none transition focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400" />
                </label>
                <label>
                    <span class="sr-only">Filtrar por tipo</span>
                    <select id="favoritos-type"
                        class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2.5 text-sm text-white outline-none transition focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400">
                        <option value="all">Todos os tipos</option>
                        <option value="movie">Filmes</option>
                        <option value="tv">Séries</option>
                    </select>
                </label>
                <label>
                    <span class="sr-only">Ordenar favoritos</span>
                    <select id="favoritos-sort"
                        class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2.5 text-sm text-white outline-none transition focus:border-yellow-400 focus:ring-1 focus:ring-yellow-400">
                        <option value="recent">Mais recentes</option>
                        <option value="title-asc">Título: A-Z</option>
                        <option value="rating-desc">Maior nota</option>
                        <option value="rating-asc">Menor nota</option>
                        <option value="year-desc">Mais recentes por ano</option>
                        <option value="year-asc">Mais antigos por ano</option>
                    </select>
                </label>
            </div>
            <p id="favoritos-count" class="mt-3 text-xs text-slate-400"></p>
        </section>
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5" id="filmesFavoritos"></div>
    </main>

    <script type="module" src="components/LanguageDropdown.js"></script>
    <script type="module" src="components/user-menu.js"></script>
    <script type="module" src="components/carousel.js"></script>
    <script type="module" src="components/barra-de-pesquisa.js"></script>
    <script src="https://kit.fontawesome.com/27e8f7a4fe.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

    <script type="module" src="FilmesFavoritos.js"></script>
</body>

</html>
