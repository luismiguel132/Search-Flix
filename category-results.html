<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categoria - Search Flix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/27e8f7a4fe.js" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 font-['Inter',sans-serif]">
  <header class="fixed top-0 z-50 flex w-full items-center justify-between border-b border-slate-700/60 bg-slate-800/95 p-4 text-white backdrop-blur-md">
    <a href="/" class="hidden text-2xl font-bold tracking-tight text-white md:block" style="font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.05em;">Search Flix</a>
    <barra-de-pesquisa></barra-de-pesquisa>
    <user-menu></user-menu>
  </header>

  <main class="mx-auto w-full max-w-6xl px-4 pb-16 pt-28">
    <div class="mb-7"><a href="/" class="mb-3 inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-yellow-400"><i class="fa-solid fa-arrow-left"></i>Voltar para início</a><h1 id="category-title" class="text-3xl font-bold text-white">Carregando...</h1><p id="category-description" class="mt-1 text-sm text-slate-400"></p></div>
    <div id="category-loading" class="py-20 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2 text-yellow-400"></i>Carregando títulos...</div>
    <div id="category-grid" class="hidden grid grid-cols-2 gap-4 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5"></div>
    <div id="category-empty" class="hidden rounded-xl border border-dashed border-slate-700 p-12 text-center text-slate-400">Nenhum título encontrado.</div>
    <div id="category-pagination" class="mt-8 flex items-center justify-center gap-4"></div>
  </main>

  <script type="module" src="components/LanguageDropdown.js"></script>
  <script type="module" src="components/user-menu.js"></script>
  <script type="module" src="components/barra-de-pesquisa.js"></script>
  <script type="module" src="category-results.js"></script>
</body>
</html>
