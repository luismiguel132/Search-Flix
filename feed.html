<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seguindo - Search Flix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/27e8f7a4fe.js" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100 font-['Inter',sans-serif]">
  <site-header></site-header>

  <main class="mx-auto w-full max-w-3xl px-4 pb-16 pt-28">
    <section class="mb-6 rounded-2xl border border-slate-700/80 bg-slate-800/80 p-5 shadow-xl">
      <div class="flex items-center gap-4"><div class="flex h-12 w-12 items-center justify-center rounded-xl bg-yellow-400/15 text-xl text-yellow-400"><i class="fa-solid fa-users"></i></div><div><h1 class="text-2xl font-bold text-white">Atividade de quem você segue</h1><p id="feed-subtitle" class="text-sm text-slate-400">Acompanhe novas notas e favoritos.</p></div></div>
    </section>
    <section class="rounded-2xl border border-slate-700/80 bg-slate-800/80 p-5 shadow-xl">
      <div class="mb-5 flex flex-wrap items-center justify-between gap-3 border-b border-slate-700/80 pb-4">
        <h2 class="text-xl font-bold text-white">Seu feed</h2>
        <div id="feed-filters" class="flex gap-1 rounded-lg bg-slate-900 p-1 text-xs">
          <button data-filter="all" class="rounded-md bg-yellow-400 px-3 py-1.5 font-bold text-black">Tudo</button>
          <button data-filter="rating" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-700">Notas</button>
          <button data-filter="favorite" class="rounded-md px-3 py-1.5 text-slate-300 hover:bg-slate-700">Favoritos</button>
        </div>
      </div>
      <div id="following-feed" class="space-y-4"><p class="py-10 text-center text-sm text-slate-400">Carregando feed...</p></div>
    </section>
  </main>
  <script type="module" src="components/LanguageDropdown.js"></script>
  <script type="module" src="components/site-header.js"></script>
  <script type="module" src="feed.js"></script>
</body>
</html>
