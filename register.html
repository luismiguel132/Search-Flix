<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Flix - Cadastro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-700 min-h-screen flex items-center justify-center">
  <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-md shadow-xl">
    <h1 class="text-4xl text-white text-center mb-8" style="font-family:'Bebas Neue',sans-serif">Search Flix</h1>

    <div id="error-msg" class="hidden bg-red-500/20 border border-red-500 text-red-300 text-sm rounded-lg p-3 mb-4"></div>
    <div id="success-msg" class="hidden bg-green-500/20 border border-green-500 text-green-300 text-sm rounded-lg p-3 mb-4"></div>

    <form id="register-form" class="flex flex-col gap-4">
      <div>
        <input id="name" type="text" placeholder="Nome (opcional)"
          class="w-full bg-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-yellow-400" />
        <span class="text-xs text-slate-400 mt-1 block">Caso prefira, você poderá adicionar ou alterar seu nome mais tarde no perfil.</span>
      </div>
      <input id="email" type="email" placeholder="E-mail" required
        class="bg-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-yellow-400" />
      <input id="password" type="password" placeholder="Senha (mín. 6 caracteres)" required
        class="bg-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-yellow-400" />
      <button type="submit"
        class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-3 rounded-lg transition">
        Cadastrar
      </button>
    </form>

    <p class="text-slate-400 text-center mt-6 text-sm">
      Já tem conta? <a href="/login.html" class="text-yellow-400 hover:underline">Entrar</a>
    </p>
  </div>

  <script type="module" src="register.js"></script>
</body>
</html>
