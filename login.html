<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Flix - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-700 min-h-screen flex items-center justify-center">
  <div class="bg-slate-800 p-8 rounded-2xl w-full max-w-md shadow-xl">
    <h1 class="text-4xl text-white text-center mb-8" style="font-family:'Bebas Neue',sans-serif">Search Flix</h1>

    <div id="error-msg" class="hidden bg-red-500/20 border border-red-500 text-red-300 text-sm rounded-lg p-3 mb-4"></div>

    <form id="login-form" class="flex flex-col gap-4">
      <input id="email" type="email" placeholder="E-mail" required
        class="bg-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-yellow-400" />
      <input id="password" type="password" placeholder="Senha" required
        class="bg-slate-700 text-white rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-yellow-400" />
      <button type="submit"
        class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-3 rounded-lg transition">
        Entrar
      </button>
    </form>

    <p class="text-slate-400 text-center mt-6 text-sm">
      Não tem conta? <a href="/register.html" class="text-yellow-400 hover:underline">Cadastre-se</a>
    </p>
  </div>

  <script type="module">
    import { getToken } from './utils/auth.js';
    if (getToken()) window.location.href = '/';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('error-msg');
      errorMsg.classList.add('hidden');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        errorMsg.textContent = data.error;
        errorMsg.classList.remove('hidden');
        return;
      }

      localStorage.setItem('sf-token', data.token);
      localStorage.setItem('sf-user', JSON.stringify(data.user));
      window.location.href = '/';
    });
  </script>
</body>
</html>
